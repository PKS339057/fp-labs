name: CI

on: [push, pull_request]

jobs:
  lab1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.7"
      - name: HLint 3.8 и Fourmolu 0.19.0.1 (те же версии, что локально)
        run: |
          mkdir -p "$HOME/bin/hlint"
          curl -fsSL https://github.com/ndmitchell/hlint/releases/download/v3.8/hlint-3.8-x86_64-linux.tar.gz | tar -xz -C "$HOME/bin/hlint" --strip-components=1
          curl -fsSL -o "$HOME/bin/fourmolu" https://github.com/fourmolu/fourmolu/releases/download/v0.19.0.1/fourmolu-0.19.0.1-linux-x86_64
          chmod +x "$HOME/bin/fourmolu"
          echo "$HOME/bin/hlint" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: make check
        working-directory: lab1
        run: make check GHC=ghc HLINT=hlint FOURMOLU=fourmolu
